<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d6efd">

  <title>الناخب</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f3f6fa;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      color: #0d6efd;
      font-size: 30px;
    }

    .header p {
      color: #666;
      margin-top: 8px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dbe3;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="tel"]:focus {
      border-color: #0d6efd;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #d5dbe3;
      border-radius: 10px;
      background: #fafafa;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 18px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #locationBtn {
      background: #198754;
      color: white;
    }

    #saveBtn {
      background: #0d6efd;
      color: white;
      min-height: 52px;
    }

    #attendanceBtn {
      background: #6f42c1;
      color: white;
      min-height: 52px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      min-height: 20px;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .info {
      background: #cff4fc;
      color: #055160;
    }

    .location-box {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: #e7f5ec;
      color: #146c43;
      border-radius: 10px;
      text-align: center;
    }

    .section-title {
      margin-top: 22px;
      margin-bottom: 5px;
      color: #0d6efd;
      font-size: 18px;
      font-weight: bold;
    }

    .attendance-box {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e1e5ea;
    }

    .attendance-info {
      background: #f3efff;
      color: #4b2a80;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.7;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>الناخب</h1>
      <p>تسجيل بيانات الناخب</p>
    </div>

    <div class="card">

      <label for="fullName">الاسم الكامل</label>
      <input id="fullName" type="text" placeholder="أدخل الاسم الكامل">

      <label for="phone">رقم الهاتف</label>
      <input id="phone" type="tel" placeholder="أدخل رقم الهاتف">

      <label for="province">المحافظة</label>
      <input id="province" type="text" placeholder="أدخل المحافظة">

      <label for="district">القضاء</label>
      <input id="district" type="text" placeholder="أدخل القضاء">

      <label for="center">المركز الانتخابي</label>
      <input id="center" type="text" placeholder="أدخل المركز الانتخابي">

      <div class="section-title">الوثائق</div>

      <label for="voterCard">صورة بطاقة الناخب</label>
      <input id="voterCard" type="file" accept="image/*" capture="environment">

      <label for="personalId">صورة الهوية الشخصية</label>
      <input id="personalId" type="file" accept="image/*" capture="environment">

      <button id="locationBtn" type="button">
        📍 تسجيل الموقع
      </button>

      <div id="locationBox" class="location-box">
        📍 تم تحديد موقع الجهاز بنجاح
        <br>
        <span id="locationText"></span>
      </div>

      <button id="saveBtn" type="button">
        💾 حفظ البيانات
      </button>

      <div class="attendance-box">

        <div class="section-title">
          تسجيل الحضور
        </div>

        <div class="attendance-info">
          تسجيل الحضور يعتمد على موقع الجهاز فقط.
          <br>
          سيتم تسجيل الاسم والوقت والموقع عند نجاح العملية.
        </div>

        <button id="attendanceBtn" type="button">
          🟣 تسجيل الحضور
        </button>

      </div>

      <div id="status"></div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://dsqufngpstfbavyopkva.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_jIAe_25gEDjB7oSEjiLOwg_BLE2SArS";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const saveBtn =
      document.getElementById("saveBtn");

    const attendanceBtn =
      document.getElementById("attendanceBtn");

    const locationBtn =
      document.getElementById("locationBtn");

    const status =
      document.getElementById("status");

    const locationBox =
      document.getElementById("locationBox");

    const locationText =
      document.getElementById("locationText");

    const fullName =
      document.getElementById("fullName");

    const phone =
      document.getElementById("phone");

    const province =
      document.getElementById("province");

    const district =
      document.getElementById("district");

    const center =
      document.getElementById("center");

    const voterCard =
      document.getElementById("voterCard");

    const personalId =
      document.getElementById("personalId");


    let currentLocation = null;


    function showStatus(message, type) {
      status.className = type || "";
      status.textContent = message;
    }


    /* =========================
       تسجيل الموقع
    ========================= */

    locationBtn.addEventListener("click", () => {

      showStatus(
        "📍 جارٍ تحديد موقع الجهاز...",
        "info"
      );

      locationBox.style.display = "none";

      if (!navigator.geolocation) {

        showStatus(
          "❌ جهازك لا يدعم تحديد الموقع.",
          "error"
        );

        return;
      }


      navigator.geolocation.getCurrentPosition(

        (position) => {

          currentLocation = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy
          };


          showStatus(
            "✅ تم تحديد موقع الجهاز بنجاح.",
            "success"
          );


          locationBox.style.display = "block";


          locationText.textContent =
            "دقة الموقع التقريبية: " +
            Math.round(position.coords.accuracy) +
            " متر";
        },


        (error) => {

          if (error.code === 1) {

            showStatus(
              "❌ تم رفض إذن الموقع.",
              "error"
            );

          } else if (error.code === 2) {

            showStatus(
              "❌ تعذر تحديد موقع الجهاز.",
              "error"
            );

          } else if (error.code === 3) {

            showStatus(
              "❌ انتهت مهلة تحديد الموقع.",
              "error"
            );

          } else {

            showStatus(
              "❌ حدث خطأ أثناء تحديد الموقع.",
              "error"
            );
          }

        },

        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );

    });


    /* =========================
       اختيار الصور
    ========================= */

    voterCard.addEventListener("change", () => {

      if (voterCard.files.length > 0) {

        showStatus(
          "📷 تم اختيار صورة بطاقة الناخب.",
          "success"
        );

      }

    });


    personalId.addEventListener("change", () => {

      if (personalId.files.length > 0) {

        showStatus(
          "📷 تم اختيار صورة الهوية الشخصية.",
          "success"
        );

      }

    });


    /* =========================
       حفظ بيانات الناخب
       مستقل عن الموقع
    ========================= */

    saveBtn.addEventListener("click", async () => {

      if (!fullName.value.trim()) {

        showStatus(
          "❌ أدخل الاسم الكامل.",
          "error"
        );

        fullName.focus();
        return;
      }


      if (!phone.value.trim()) {

        showStatus(
          "❌ أدخل رقم الهاتف.",
          "error"
        );

        phone.focus();
        return;
      }


      if (!province.value.trim()) {

        showStatus(
          "❌ أدخل المحافظة.",
          "error"
        );

        province.focus();
        return;
      }


      if (!district.value.trim()) {

        showStatus(
          "❌ أدخل القضاء.",
          "error"
        );

        district.focus();
        return;
      }


      if (!center.value.trim()) {

        showStatus(
          "❌ أدخل المركز الانتخابي.",
          "error"
        );

        center.focus();
        return;
      }


      if (!voterCard.files.length) {

        showStatus(
          "❌ اختر صورة بطاقة الناخب.",
          "error"
        );

        return;
      }


      if (!personalId.files.length) {

        showStatus(
          "❌ اختر صورة الهوية الشخصية.",
          "error"
        );

        return;
      }


      saveBtn.disabled = true;

      showStatus(
        "⏳ جارٍ حفظ البيانات...",
        "info"
      );


      try {

        const { error } =
          await supabaseClient
            .from("voters")
            .insert({
              full_name:
                fullName.value.trim(),

              phone:
                phone.value.trim(),

              province:
                province.value.trim(),

              district:
                district.value.trim(),

              electoral_center:
                center.value.trim()
            });


        if (error) {

          console.error(error);

          showStatus(
            "❌ فشل حفظ البيانات: " +
            error.message,
            "error"
          );

          saveBtn.disabled = false;
          return;
        }


        showStatus(
          "✅ تم حفظ بيانات الناخب بنجاح.",
          "success"
        );


      } catch (error) {

        console.error(error);

        showStatus(
          "❌ حدث خطأ أثناء حفظ البيانات.",
          "error"
        );

      }


      saveBtn.disabled = false;

    });


    /* =========================
       تسجيل الحضور
    ========================= */

    attendanceBtn.addEventListener(
      "click",
      async () => {

        const name =
          fullName.value.trim();


        if (!name) {

          showStatus(
            "❌ أدخل الاسم الكامل أولاً.",
            "error"
          );

          fullName.focus();

          return;
        }


        attendanceBtn.disabled = true;


        showStatus(
          "📍 جارٍ تحديد موقعك لتسجيل الحضور...",
          "info"
        );


        if (!navigator.geolocation) {

          showStatus(
            "❌ جهازك لا يدعم تحديد الموقع.",
            "error"
          );

          attendanceBtn.disabled = false;

          return;
        }


        navigator.geolocation.getCurrentPosition(

          async (position) => {

            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;

            const accuracy =
              position.coords.accuracy;


            showStatus(
              "⏳ جارٍ تسجيل الحضور...",
              "info"
            );


            try {

              const { data, error } =
                await supabaseClient.rpc(
                  "record_attendance",
                  {
                    p_full_name: name,
                    p_latitude: latitude,
                    p_longitude: longitude,
                    p_accuracy: accuracy
                  }
                );


              if (error) {

                console.error(error);

                showStatus(
                  "❌ تعذر تسجيل الحضور: " +
                  error.message,
                  "error"
                );

                attendanceBtn.disabled = false;

                return;
              }


              if (!data || data.success !== true) {

                showStatus(
                  "❌ " +
                  (
                    data?.message ||
                    "لم يتم تسجيل الحضور."
                  ),
                  "error"
                );

                attendanceBtn.disabled = false;

                return;
              }


              showStatus(
                "✅ تم تسجيل الحضور بنجاح.",
                "success"
              );


              locationBox.style.display = "block";

              locationText.textContent =
                "تم تسجيل الموقع بدقة تقريبية " +
                Math.round(accuracy) +
                " متر";


            } catch (error) {

              console.error(error);

              showStatus(
                "❌ حدث خطأ أثناء تسجيل الحضور.",
                "error"
              );

            }


            attendanceBtn.disabled = false;

          },


          (error) => {

            if (error.code === 1) {

              showStatus(
                "❌ يجب السماح بالوصول إلى الموقع لتسجيل الحضور.",
                "error"
              );

            } else if (error.code === 2) {

              showStatus(
                "❌ تعذر تحديد موقع الجهاز.",
                "error"
              );

            } else if (error.code === 3) {

              showStatus(
                "❌ انتهت مهلة تحديد الموقع.",
                "error"
              );

            } else {

              showStatus(
                "❌ حدث خطأ أثناء تحديد الموقع.",
                "error"
              );

            }


            attendanceBtn.disabled = false;

          },


          {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
          }

        );

      }
    );

  </script>

</body>

</html>
