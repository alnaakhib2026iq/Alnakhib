<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d6efd">

  <title>الناخب</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f3f6fa;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #0d6efd;
      margin: 0 0 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    #locationBtn {
      background: #198754;
      color: white;
    }

    #saveBtn {
      background: #0d6efd;
      color: white;
      margin-top: 15px;
    }

    #saveBtn:disabled {
      background: #9bbce8;
      cursor: not-allowed;
    }

    button:active {
      transform: scale(0.99);
    }

    #status {
      text-align: center;
      margin-top: 14px;
      font-weight: bold;
      line-height: 1.7;
    }

    .location-box {
      background: #f1f8ff;
      border: 1px solid #b8daff;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      font-size: 14px;
      display: none;
    }

    .success {
      color: #198754;
    }

    .error {
      color: #dc3545;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>الناخب</h1>

    <div class="field">
      <label for="fullName">1. الاسم الكامل</label>
      <input
        type="text"
        id="fullName"
        placeholder="أدخل الاسم الكامل"
      >
    </div>

    <div class="field">
      <label for="phone">2. رقم الهاتف</label>
      <input
        type="tel"
        id="phone"
        placeholder="أدخل رقم الهاتف"
      >
    </div>

    <div class="field">
      <label for="province">3. المحافظة</label>
      <input
        type="text"
        id="province"
        placeholder="أدخل المحافظة"
      >
    </div>

    <div class="field">
      <label for="district">4. القضاء</label>
      <input
        type="text"
        id="district"
        placeholder="أدخل القضاء"
      >
    </div>

    <div class="field">
      <label for="center">5. المركز الانتخابي</label>
      <input
        type="text"
        id="center"
        placeholder="أدخل المركز الانتخابي"
      >
    </div>

    <div class="field">
      <label for="voterCard">6. صورة بطاقة الناخب</label>
      <input
        type="file"
        id="voterCard"
        accept="image/*"
        capture="environment"
      >
    </div>

    <div class="field">
      <label for="personalId">7. صورة الهوية الشخصية</label>
      <input
        type="file"
        id="personalId"
        accept="image/*"
        capture="environment"
      >
    </div>

    <button id="locationBtn" type="button">
      📍 تسجيل الدخول والتحقق من الموقع
    </button>

    <div id="status"></div>

    <div id="locationBox" class="location-box">
      📍 تم تحديد موقع الجهاز بنجاح
      <br>
      <span id="locationText"></span>
    </div>

    <button id="saveBtn" type="button" disabled>
      💾 حفظ البيانات
    </button>

  </div>

  <div class="footer">
    تطبيق الناخب
  </div>

</div>

<script>

  const locationBtn = document.getElementById("locationBtn");
  const saveBtn = document.getElementById("saveBtn");
  const status = document.getElementById("status");
  const locationBox = document.getElementById("locationBox");
  const locationText = document.getElementById("locationText");

  const fullName = document.getElementById("fullName");
  const phone = document.getElementById("phone");
  const province = document.getElementById("province");
  const district = document.getElementById("district");
  const center = document.getElementById("center");
  const voterCard = document.getElementById("voterCard");
  const personalId = document.getElementById("personalId");

  let currentLocation = null;
  let locationVerified = false;
  let verificationTime = null;

  function showError(message) {
    status.className = "error";
    status.textContent = message;
  }

  function showSuccess(message) {
    status.className = "success";
    status.textContent = message;
  }

  /*
    تسجيل الدخول والتحقق من الموقع
  */

  locationBtn.addEventListener("click", () => {

    locationVerified = false;
    saveBtn.disabled = true;

    locationBox.style.display = "none";

    status.className = "";
    status.textContent = "📍 جارٍ تحديد موقع الجهاز...";

    if (!navigator.geolocation) {
      showError("❌ جهازك لا يدعم تحديد الموقع.");
      return;
    }

    navigator.geolocation.getCurrentPosition(

      (position) => {

        currentLocation = {
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          accuracy: position.coords.accuracy
        };

        verificationTime = new Date().toISOString();

        locationVerified = true;

        showSuccess("✅ تم تسجيل الدخول والتحقق من موقع الجهاز.");

        locationBox.style.display = "block";

        locationText.textContent =
          "دقة الموقع التقريبية: " +
          Math.round(position.coords.accuracy) +
          " متر";

        saveBtn.disabled = false;
      },

      (error) => {

        locationVerified = false;
        saveBtn.disabled = true;

        if (error.code === 1) {

          showError(
            "❌ تم رفض إذن الموقع. اسمح للتطبيق باستخدام الموقع من إعدادات الهاتف."
          );

        } else if (error.code === 2) {

          showError(
            "❌ تعذر تحديد موقع الجهاز. تأكد من تشغيل خدمة الموقع."
          );

        } else if (error.code === 3) {

          showError(
            "❌ انتهت مهلة تحديد الموقع. حاول مرة أخرى."
          );

        } else {

          showError(
            "❌ تعذر تحديد موقع الجهاز."
          );
        }
      },

      {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      }
    );
  });


  /*
    اختيار صورة بطاقة الناخب
  */

  voterCard.addEventListener("change", () => {

    if (voterCard.files.length > 0) {
      showSuccess("📷 تم اختيار صورة بطاقة الناخب.");
    }
  });


  /*
    اختيار صورة الهوية
  */

  personalId.addEventListener("change", () => {

    if (personalId.files.length > 0) {
      showSuccess("📷 تم اختيار صورة الهوية الشخصية.");
    }
  });


  /*
    حفظ البيانات
  */

  saveBtn.addEventListener("click", () => {

    if (!locationVerified) {
      showError("❌ يجب تسجيل الدخول والتحقق من الموقع أولاً.");
      return;
    }

    if (!fullName.value.trim()) {
      showError("❌ أدخل الاسم الكامل.");
      fullName.focus();
      return;
    }

    if (!phone.value.trim()) {
      showError("❌ أدخل رقم الهاتف.");
      phone.focus();
      return;
    }

    if (!province.value.trim()) {
      showError("❌ أدخل المحافظة.");
      province.focus();
      return;
    }

    if (!district.value.trim()) {
      showError("❌ أدخل القضاء.");
      district.focus();
      return;
    }

    if (!center.value.trim()) {
      showError("❌ أدخل المركز الانتخابي.");
      center.focus();
      return;
    }

    if (!voterCard.files.length) {
      showError("❌ اختر صورة بطاقة الناخب.");
      return;
    }

    if (!personalId.files.length) {
      showError("❌ اختر صورة الهوية الشخصية.");
      return;
    }

    showSuccess(
      "✅ تم التحقق من البيانات والموقع، والبيانات جاهزة للحفظ."
    );

  });

</script>

</body>
</html>
