<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الكابينة الانتخابية</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #172554, #2563eb, #06b6d4);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 520px;
    background: rgba(255,255,255,0.96);
    border-radius: 25px;
    padding: 28px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header .icon {
    font-size: 55px;
}

h1 {
    margin: 8px 0;
    color: #172554;
    font-size: 28px;
}

.subtitle {
    color: #64748b;
    font-size: 14px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    color: #1e293b;
}

input {
    width: 100%;
    padding: 14px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    outline: none;
    font-size: 16px;
    transition: 0.3s;
}

input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}

.photo-box {
    border: 2px dashed #94a3b8;
    border-radius: 15px;
    padding: 18px;
    text-align: center;
    background: #f8fafc;
}

.photo-box input {
    border: none;
    padding: 5px;
}

button {
    width: 100%;
    border: none;
    padding: 16px;
    border-radius: 14px;
    background: linear-gradient(90deg, #2563eb, #0891b2);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

button:hover {
    opacity: 0.9;
}

.footer {
    text-align: center;
    margin-top: 18px;
    color: #64748b;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="icon">🗳️</div>
        <h1>الكابينة الانتخابية</h1>
        <div class="subtitle">
            معلومات الناخب
        </div>
    </div>

    <form>

        <div class="form-group">
            <label>👤 اسم الناخب الكامل واللقب</label>
            <input type="text" placeholder="أدخل الاسم الكامل واللقب">
        </div>

        <div class="form-group">
            <label>📍 المحافظة</label>
            <input type="text" placeholder="أدخل المحافظة">
        </div>

        <div class="form-group">
            <label>🏛️ القضاء</label>
            <input type="text" placeholder="أدخل القضاء">
        </div>

        <div class="form-group">
            <label>📱 رقم الهاتف</label>
            <input type="tel" placeholder="أدخل رقم الهاتف">
        </div>

        <div class="form-group">
            <label>🪪 صورة بطاقة الناخب</label>

            <div class="photo-box">
                <input type="file" accept="image/*">
            </div>
        </div>

        <div class="form-group">
            <label>🆔 صورة الهوية الشخصية</label>

            <div class="photo-box">
                <input type="file" accept="image/*">
            </div>
        </div>

        <button type="button">
            حفظ معلومات الناخب
        </button>

    </form>

    <div class="footer">
        نظام معلومات الناخب
    </div>

</div>

</body>
</html>
