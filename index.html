<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0d6efd">

  <title>الناخب</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f3f6fa;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #0d6efd;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    #fingerprintBtn {
      background: #198754;
      color: white;
    }

    #saveBtn {
      background: #0d6efd;
      color: white;
      margin-top: 15px;
    }

    button:active {
      transform: scale(0.99);
    }

    #fingerprintStatus {
      text-align: center;
      margin-top: 14px;
      font-weight: bold;
      line-height: 1.7;
    }

    .location-box {
      background: #f1f8ff;
      border: 1px solid #b8daff;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      font-size: 14px;
      display: none;
    }

    .success {
      color: #198754;
    }

    .error {
      color: #dc3545;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>الناخب</h1>

      <div class="field">
        <label for="fullName">1. الاسم الكامل</label>
        <input
          type="text"
          id="fullName"
          placeholder="أدخل الاسم الكامل"
        >
      </div>

      <div class="field">
        <label for="phone">2. رقم الهاتف</label>
        <input
          type="tel"
          id="phone"
          placeholder="أدخل رقم الهاتف"
        >
      </div>

      <div class="field">
        <label for="province">3. المحافظة</label>
        <input
          type="text"
          id="province"
          placeholder="أدخل المحافظة"
        >
      </div>

      <div class="field">
        <label for="district">4. القضاء</label>
        <input
          type="text"
          id="district"
          placeholder="أدخل القضاء"
        >
      </div>

      <div class="field">
        <label for="center">5. المركز الانتخابي</label>
        <input
          type="text"
          id="center"
          placeholder="أدخل المركز الانتخابي"
        >
      </div>

      <div class="field">
        <label for="voterCard">6. صورة بطاقة الناخب</label>
        <input
          type="file"
          id="voterCard"
          accept="image/*"
          capture="environment"
        >
      </div>

      <div class="field">
        <label for="personalId">7. صورة الهوية الشخصية</label>
        <input
          type="file"
          id="personalId"
          accept="image/*"
          capture="environment"
        >
      </div>

      <button id="fingerprintBtn" type="button">
        🔐 التحقق البيومتري
      </button>

      <div id="fingerprintStatus"></div>

      <div id="locationBox" class="location-box">
        📍 تم تحديد موقع الجهاز.
        <br>
        <span id="locationText"></span>
      </div>

      <button id="saveBtn" type="button">
        💾 حفظ البيانات
      </button>

    </div>

    <div class="footer">
      تطبيق الناخب
    </div>

  </div>

  <script>

    const fingerprintBtn =
      document.getElementById("fingerprintBtn");

    const fingerprintStatus =
      document.getElementById("fingerprintStatus");

    const locationBox =
      document.getElementById("locationBox");

    const locationText =
      document.getElementById("locationText");

    const saveBtn =
      document.getElementById("saveBtn");

    let currentLocation = null;
    let verificationTime = null;
    let locationVerified = false;

    /*
      الخطوة الأولى:
      عند الضغط على التحقق البيومتري
      نطلب الموقع أولاً.
    */

    fingerprintBtn.addEventListener("click", () => {

      fingerprintStatus.className = "";
      fingerprintStatus.textContent =
        "📍 جارٍ تحديد موقع الجهاز...";

      locationVerified = false;

      if (!navigator.geolocation) {

        fingerprintStatus.className = "error";

        fingerprintStatus.textContent =
          "❌ جهازك لا يدعم تحديد الموقع.";

        return;
      }

      navigator.geolocation.getCurrentPosition(

        (position) => {

          currentLocation = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy
          };

          verificationTime =
            new Date().toISOString();

          locationVerified = true;

          fingerprintStatus.className = "success";

          fingerprintStatus.textContent =
            "✅ تم تحديد موقع الجهاز بنجاح";

          locationBox.style.display = "block";

          locationText.textContent =
            "تم تحديد الموقع بنجاح";

        },

        (error) => {

          locationVerified = false;

          fingerprintStatus.className = "error";

          if (error.code === 1) {

            fingerprintStatus.textContent =
              "❌ تم رفض إذن الموقع. اسمح للتطبيق باستخدام الموقع من إعدادات الهاتف.";

          } else if (error.code === 2) {

            fingerprintStatus.textContent =
              "❌ تعذر تحديد موقع الجهاز. تأكد من تشغيل الموقع.";

          } else if (error.code === 3) {

            fingerprintStatus.textContent =
              "❌ انتهت مهلة تحديد الموقع. حاول مرة أخرى.";

          } else {

            fingerprintStatus.textContent =
              "❌ تعذر تحديد موقع الجهاز.";

          }

        },

        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }

      );

    });


    /*
      منع الحفظ قبل تحديد الموقع.
    */

    saveBtn.addEventListener("click", () => {

      if (!locationVerified) {

        fingerprintStatus.className = "error";

        fingerprintStatus.textContent =
          "❌ يجب تحديد موقع الجهاز أولاً.";

        return;
      }

      fingerprintStatus.className = "success";

      fingerprintStatus.textContent =
        "✅ تم التحقق من الموقع ويمكن المتابعة.";

    });


    /*
      الكاميرا:
      حقلا الصور يستخدمان:
      accept="image/*"
      capture="environment"

      وهذا يسمح لأندرويد بإظهار خيار
      التقاط صورة بالكاميرا عند اختيار الصورة.
    */

    const voterCard =
      document.getElementById("voterCard");

    const personalId =
      document.getElementById("personalId");

    voterCard.addEventListener("change", () => {

      if (voterCard.files.length > 0) {

        fingerprintStatus.className = "success";

        fingerprintStatus.textContent =
          "📷 تم اختيار صورة بطاقة الناخب.";

      }

    });


    personalId.addEventListener("change", () => {

      if (personalId.files.length > 0) {

        fingerprintStatus.className = "success";

        fingerprintStatus.textContent =
          "📷 تم اختيار صورة الهوية الشخصية.";

      }

    });

  </script>

</body>
</html>
