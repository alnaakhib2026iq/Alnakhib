<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d6efd">

  <title>الناخب</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f3f6fa;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      color: #0d6efd;
      font-size: 30px;
    }

    .header p {
      color: #666;
      margin-top: 8px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dbe3;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="tel"]:focus {
      border-color: #0d6efd;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #d5dbe3;
      border-radius: 10px;
      background: #fafafa;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 18px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #attendanceBtn {
      background: #198754;
      color: white;
    }

    #attendanceBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #saveBtn {
      background: #0d6efd;
      color: white;
      min-height: 52px;
    }

    #saveBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      min-height: 20px;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .section-title {
      margin-top: 22px;
      margin-bottom: 5px;
      color: #0d6efd;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>الناخب</h1>
      <p>تسجيل بيانات الناخب</p>
    </div>

    <div class="card">

      <label for="fullName">الاسم الكامل</label>
      <input
        id="fullName"
        type="text"
        placeholder="أدخل الاسم الكامل"
      >

      <label for="phone">رقم الهاتف</label>
      <input
        id="phone"
        type="tel"
        placeholder="أدخل رقم الهاتف"
      >

      <label for="province">المحافظة</label>
      <input
        id="province"
        type="text"
        placeholder="أدخل المحافظة"
      >

      <label for="district">القضاء</label>
      <input
        id="district"
        type="text"
        placeholder="أدخل القضاء"
      >

      <label for="center">المركز الانتخابي</label>
      <input
        id="center"
        type="text"
        placeholder="أدخل المركز الانتخابي"
      >

      <div class="section-title">الوثائق</div>

      <label for="voterCard">صورة بطاقة الناخب</label>
      <input
        id="voterCard"
        type="file"
        accept="image/*"
        capture="environment"
      >

      <label for="personalId">صورة الهوية الشخصية</label>
      <input
        id="personalId"
        type="file"
        accept="image/*"
        capture="environment"
      >

      <button id="attendanceBtn" type="button">
        📍 تسجيل الحضور
      </button>

      <div id="status"></div>

      <button id="saveBtn" type="button">
        💾 حفظ البيانات
      </button>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://dsqufngpstfbavyopkva.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_jIAe_25gEDjB7oSEjiLOwg_BLE2SArS";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const attendanceBtn =
      document.getElementById("attendanceBtn");

    const saveBtn =
      document.getElementById("saveBtn");

    const status =
      document.getElementById("status");

    const fullName =
      document.getElementById("fullName");

    const phone =
      document.getElementById("phone");

    const province =
      document.getElementById("province");

    const district =
      document.getElementById("district");

    const center =
      document.getElementById("center");

    const voterCardFile =
      document.getElementById("voterCard");
    const personalIdFile =
      document.getElementById("personalId");

    function showSuccess(message) {
      status.className = "success";
      status.textContent = message;
    }


    function showError(message) {
      status.className = "error";
      status.textContent = message;
    }


    /*
    ==========================================
    تسجيل الحضور
    الموقع فقط
    ==========================================
    */

    attendanceBtn.addEventListener("click", () => {

      if (!navigator.geolocation) {

        showError(
          "❌ جهازك لا يدعم تحديد الموقع."
        );

        return;
      }

      attendanceBtn.disabled = true;

      status.className = "";

      status.textContent =
        "📍 جارٍ تحديد موقع الجهاز...";


      navigator.geolocation.getCurrentPosition(

        async (position) => {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;


          status.textContent =
            "⏳ تم تحديد الموقع، جارٍ تسجيل الحضور...";


          try {

            const { data, error } =
              await supabaseClient.rpc(
                "record_attendance",
                {
                  p_full_name:
                    fullName.value.trim() || null,

                  p_latitude:
                    latitude,

                  p_longitude:
                    longitude,

                  p_accuracy:
                    accuracy
                }
              );


            if (error) {

              console.error(error);

              showError(
                "❌ فشل تسجيل الحضور: " +
                error.message
              );

              attendanceBtn.disabled = false;

              return;
            }


            if (!data || data.success !== true) {

              showError(
                "❌ " +
                (
                  data && data.message
                    ? data.message
                    : "تعذر تسجيل الحضور."
                )
              );

              attendanceBtn.disabled = false;

              return;
            }


            showSuccess(
              "✅ تم تسجيل الحضور بنجاح."
            );

            attendanceBtn.disabled = false;

          } catch (error) {

            console.error(error);

            showError(
              "❌ حدث خطأ أثناء تسجيل الحضور."
            );

            attendanceBtn.disabled = false;
          }

        },


        (error) => {

          attendanceBtn.disabled = false;

          if (error.code === 1) {

            showError(
              "❌ يجب السماح للتطبيق بالوصول إلى الموقع."
            );

          } else if (error.code === 2) {

            showError(
              "❌ تعذر تحديد موقع الجهاز."
            );

          } else if (error.code === 3) {

            showError(
              "❌ انتهت مهلة تحديد الموقع."
            );

          } else {

            showError(
              "❌ حدث خطأ أثناء تحديد الموقع."
            );
          }
        },


        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    });


    /*
    ==========================================
    اختيار الصور
    ==========================================
    */

    voterCard.addEventListener("change", () => {

      if (voterCard.files.length > 0) {

        showSuccess(
          "📷 تم اختيار صورة بطاقة الناخب."
        );
      }
    });


    personalId.addEventListener("change", () => {

      if (personalId.files.length > 0) {

        showSuccess(
          "📷 تم اختيار صورة الهوية الشخصية."
        );
      }
    });


    /*
    ==========================================
    رفع صورة إلى Storage
    ==========================================
    */

    async function uploadDocument(file, folder) {

      const extension =
        file.name.includes(".")
          ? file.name.split(".").pop().toLowerCase()
          : "jpg";


      const safeExtension =
        /^[a-z0-9]+$/.test(extension)
          ? extension
          : "jpg";


      const fileName =
        Date.now() +
        "_" +
        crypto.randomUUID() +
        "." +
        safeExtension;


      const filePath =
        folder + "/" + fileName;


      const { error } =
        await supabaseClient
          .storage
          .from("voter-documents")
          .upload(
            filePath,
            file,
            {
              contentType:
                file.type || "image/jpeg",

              upsert: false
            }
          );


      if (error) {
        throw error;
      }


      return filePath;
    }


    /*
    ==========================================
    حفظ بيانات الناخب + الصور
    الموقع غير مطلوب
    ==========================================
    */

    saveBtn.addEventListener("click", async () => {

      if (!fullName.value.trim()) {

        showError(
          "❌ أدخل الاسم الكامل."
        );

        fullName.focus();

        return;
      }


      if (!phone.value.trim()) {

        showError(
          "❌ أدخل رقم الهاتف."
        );

        phone.focus();

        return;
      }


      if (!province.value.trim()) {

        showError(
          "❌ أدخل المحافظة."
        );

        province.focus();

        return;
      }


      if (!district.value.trim()) {

        showError(
          "❌ أدخل القضاء."
        );

        district.focus();

        return;
      }


      if (!center.value.trim()) {

        showError(
          "❌ أدخل المركز الانتخابي."
        );

        center.focus();

        return;
      }


      if (!voterCard.files.length) {

        showError(
          "❌ اختر صورة بطاقة الناخب."
        );

        return;
      }


      if (!personalId.files.length) {

        showError(
          "❌ اختر صورة الهوية الشخصية."
        );

        return;
      }


      const voterCardFile =
        voterCard.files[0];

      const personalIdFile =
        personalId.files[0];


      if (!voterCardFile.type.startsWith("image/")) {

        showError(
          "❌ ملف بطاقة الناخب يجب أن يكون صورة."
        );

        return;
      }


      if (!personalIdFile.type.startsWith("image/")) {

        showError(
          "❌ ملف الهوية الشخصية يجب أن يكون صورة."
        );

        return;
      }


      const maxSize =
        10 * 1024 * 1024;


      if (voterCardFile.size > maxSize) {

        showError(
          "❌ صورة بطاقة الناخب أكبر من 10 ميغابايت."
        );

        return;
      }


      if (personalIdFile.size > maxSize) {

        showError(
          "❌ صورة الهوية الشخصية أكبر من 10 ميغابايت."
        );

        return;
      }


      saveBtn.disabled = true;

      status.className = "";

      status.textContent =
        "⏳ جارٍ رفع صور الوثائق...";


      let voterCardPath = null;
      let personalIdPath = null;


      try {

        voterCardPath =
          await uploadDocument(
            voterCardFile,
            "voter-cards"
          );


        status.textContent =
          "⏳ تم رفع بطاقة الناخب، جارٍ رفع الهوية...";


        personalIdPath =
          await uploadDocument(
            personalIdFile,
            "personal-ids"
          );


        status.textContent =
          "⏳ جارٍ حفظ بيانات الناخب...";


        const { error } =
          await supabaseClient
            .from("voters")
            .insert({

              full_name:
                fullName.value.trim(),

              phone:
                phone.value.trim(),

              province:
                province.value.trim(),

              district:
                district.value.trim(),

              electoral_center:
                center.value.trim(),

              voter_card_path:
                voterCardPath,

              personal_id_path:
                personalIdPath
            });


        if (error) {

          console.error(error);

          showError(
            "❌ فشل حفظ بيانات الناخب: " +
            error.message
          );

          saveBtn.disabled = false;

          return;
        }


        showSuccess(
          "✅ تم حفظ بيانات الناخب والصور بنجاح."
        );

        saveBtn.disabled = false;


      } catch (error) {

        console.error(error);

        showError(
          "❌ حدث خطأ أثناء رفع الصور أو حفظ البيانات."
        );

        saveBtn.disabled = false;
      }

    });

  </script>

</body>
</html>
