<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الناخب</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: linear-gradient(135deg, #061b35, #0b4f78);
            min-height: 100vh;
            color: #fff;
            padding-bottom: 120px;
        }

        .header {
            text-align: center;
            padding: 30px 15px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin-top: 10px;
            color: #d8edf7;
        }

        .container {
            width: 92%;
            max-width: 600px;
            margin: auto;
        }

        .card {
            background: rgba(255,255,255,0.97);
            color: #17202a;
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #d2d7dc;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            background: #fff;
        }

        input:focus,
        select:focus {
            border-color: #087ea4;
            box-shadow: 0 0 0 3px rgba(8,126,164,0.12);
        }

        .file-box {
            border: 2px dashed #9bb7c5;
            padding: 15px;
            border-radius: 14px;
            background: #f6fafc;
        }

        .submit-btn {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            color: white;
            background: #087ea4;
            cursor: pointer;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* زر البصمة الثابت */
        .fingerprint-button {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.9);
            background: #087ea4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .fingerprint-button:active {
            transform: translateX(-50%) scale(0.93);
        }

        .fingerprint-text {
            position: fixed;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: white;
            z-index: 10000;
            pointer-events: none;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 13px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #d9f7e5;
            color: #146c38;
        }

        .error {
            background: #ffe1e1;
            color: #a51d1d;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🗳️ تسجيل الناخب</h1>
        <p>يرجى إدخال المعلومات المطلوبة</p>
    </div>

    <div class="container">

        <div class="card">

            <form id="voterForm">

                <div class="field">
                    <label>الاسم الكامل</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="أدخل الاسم الكامل"
                        required>
                </div>

                <div class="field">
                    <label>رقم الهاتف</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="07xxxxxxxxx"
                        required>
                </div>

                <div class="field">
                    <label>المحافظة</label>
                    <select id="governorate" required>
                        <option value="">اختر المحافظة</option>
                        <option>بغداد</option>
                        <option>الأنبار</option>
                        <option>بابل</option>
                        <option>البصرة</option>
                        <option>ديالى</option>
                        <option>القادسية</option>
                        <option>كربلاء</option>
                        <option>كركوك</option>
                        <option>ميسان</option>
                        <option>المثنى</option>
                        <option>النجف</option>
                        <option>نينوى</option>
                        <option>صلاح الدين</option>
                        <option>ذي قار</option>
                        <option>واسط</option>
                        <option>أربيل</option>
                        <option>دهوك</option>
                        <option>السليمانية</option>
                    </select>
                </div>

                <div class="field">
                    <label>القضاء</label>
                    <input
                        type="text"
                        id="district"
                        placeholder="أدخل اسم القضاء"
                        required>
                </div>

                <div class="field">
                    <label>المركز الانتخابي</label>
                    <input
                        type="text"
                        id="center"
                        placeholder="أدخل المركز الانتخابي"
                        required>
                </div>

                <div class="field">
                    <label>صورة بطاقة الناخب</label>
                    <div class="file-box">
                        <input
                            type="file"
                            id="voterCard"
                            accept="image/*"
                            required>
                    </div>
                </div>

                <div class="field">
                    <label>صورة الهوية الشخصية</label>
                    <div class="file-box">
                        <input
                            type="file"
                            id="personalId"
                            accept="image/*"
                            required>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    حفظ البيانات
                </button>

                <div id="formMessage" class="message"></div>

            </form>

        </div>
    </div>

    <!-- أيقونة البصمة -->
    <button
        class="fingerprint-button"
        id="fingerprintButton"
        aria-label="استخدام بصمة الإصبع">
        👆
    </button>

    <div class="fingerprint-text">
        بصمة الإصبع
    </div>


<script>

const fingerprintButton =
    document.getElementById("fingerprintButton");

const formMessage =
    document.getElementById("formMessage");


// التحقق من دعم البصمة / Passkey
fingerprintButton.addEventListener("click", async function () {

    formMessage.style.display = "block";
    formMessage.className = "message";

    if (!window.PublicKeyCredential) {

        formMessage.classList.add("error");

        formMessage.textContent =
            "هذا الجهاز أو المتصفح لا يدعم استخدام البصمة.";

        return;
    }

    try {

        /*
         * ملاحظة:
         * التحقق الحقيقي من WebAuthn يحتاج إلى خادم Backend
         * لإنشاء challenge والتحقق من الاستجابة.
         *
         * هذا الجزء يختبر دعم الجهاز للنظام.
         */

        const available =
            await PublicKeyCredential
                .isUserVerifyingPlatformAuthenticatorAvailable();

        if (!available) {

            formMessage.classList.add("error");

            formMessage.textContent =
                "لا توجد بصمة أو وسيلة تحقق بيومترية متاحة على هذا الجهاز.";

            return;
        }

        formMessage.classList.add("success");

        formMessage.textContent =
            "البصمة متاحة على جهازك. سيتم ربط التحقق بالخادم عند إضافة قاعدة البيانات.";

    } catch (error) {

        formMessage.classList.add("error");

        formMessage.textContent =
            "تعذر تشغيل نظام البصمة.";

        console.error(error);
    }

});


// إرسال النموذج
document.getElementById("voterForm").addEventListener("submit", function(event) {

    event.preventDefault();

    formMessage.style.display = "block";
    formMessage.className = "message success";

    formMessage.textContent =
        "تم إدخال البيانات بنجاح. الحفظ الفعلي يحتاج إلى قاعدة بيانات آمنة.";

});

</script>

</body>
</html>
