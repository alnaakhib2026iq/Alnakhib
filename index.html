9<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d6efd">
  <title>الناخب</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f3f6fa;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #0d6efd;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #0d6efd;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0b5ed7;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>الناخب</h1>

    <div class="field">
      <label>1. الاسم الكامل</label>
      <input type="text" placeholder="أدخل الاسم الكامل">
    </div>

    <div class="field">
  <label>2. رقم الهاتف</label>
  <input type="tel" placeholder="أدخل رقم الهاتف">
</div>

<div class="field">
  <label>3. المحافظة</label>
  <input type="text" placeholder="أدخل المحافظة">
</div>

    <div class="field">
      <label>3. القضاء</label>
      <input type="text" placeholder="أدخل القضاء">
    </div>

    <div class="field">
      <label>4. المركز الانتخابي</label>
      <input type="text" placeholder="أدخل المركز الانتخابي">
    </div>

    <div class="field">
      <label>5. صورة بطاقة الناخب</label>
      <input type="file" accept="image/*">
    </div>

    <div class="field">
      <label>6. صورة الهوية الشخصية</label>
      <input type="file" accept="image/*">
    </div>

    <button type="button" id="fingerprintBtn">🔐 تسجيل البصمة</button>

<p id="fingerprintStatus" style="text-align:center; margin-top:15px;"></p>

<button type="button" id="saveBtn">حفظ البيانات</button>

  </div>
<script>
const fingerprintBtn = document.getElementById("fingerprintBtn");
const fingerprintStatus = document.getElementById("fingerprintStatus");

 {fingerprintBtn.addEventListener("click", async () => {
  try {
    const { BiometricAuth } = Capacitor.Plugins;

    const result = await BiometricAuth.authenticate({
      reason: "التحقق من هوية المستخدم",
      title: "التحقق البيومتري",
      subtitle: "استخدم بصمة إصبعك",
      description: "ضع إصبعك على مستشعر البصمة",
      negativeButtonText: "إلغاء"
    });

    if (result.verified) {
      fingerprintStatus.textContent =
        "✅ تم التحقق بالبصمة بنجاح";
    } else {
      fingerprintStatus.textContent =
        "❌ لم يتم التحقق";
    }

  } catch (error) {
    fingerprintStatus.textContent =
      "❌ فشل التحقق بالبصمة";
    console.error(error);
  }
});
  if (!window.PublicKeyCredential) {
    fingerprintStatus.textContent =
      "هذا الجهاز أو المتصفح لا يدعم تسجيل البصمة.";
    return;
  }

  try {
    const credential = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: {
          name: "الناخب"
        },
        user: {
          id: crypto.getRandomValues(new Uint8Array(16)),
          name: "voter",
          displayName: "مستخدم الناخب"
        },
        pubKeyCredParams: [
          {
            type: "public-key",
            alg: -7
          }
        ],
        authenticatorSelection: {
          authenticatorAttachment: "platform",
          userVerification: "required"
        },
        timeout: 60000,
        attestation: "none"
      }
    });

    if (credential) {
      fingerprintStatus.textContent =
        "✅ تم تسجيل البصمة بنجاح";
    }
  } catch (error) {
    fingerprintStatus.textContent =
      "❌ لم يتم تسجيل البصمة.";
  }
});
          </script>
</body>
</html>
