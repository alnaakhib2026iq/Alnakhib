name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "alnaakhib",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.4.3",
              "@capacitor/core": "^7.4.3",
              "@capacitor/camera": "^7.0.0",
              "@aparajita/capacitor-biometric-auth": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Clean Android
        run: rm -rf android

      - name: Add Android
        run: npx cap add android

      - name: Add Camera plugin
        run: npx cap sync android

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = """
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.CAMERA" />
          <uses-feature
              android:name="android.hardware.camera.any"
              android:required="false" />
          <uses-feature
              android:name="android.hardware.location.gps"
              android:required="false" />
          """

          marker = "</manifest>"

          if marker not in text:
              raise SystemExit("AndroidManifest.xml غير صالح")

          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              text = text.replace(marker, permissions + "\n" + marker)

          manifest.write_text(text)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alnaakhib-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
